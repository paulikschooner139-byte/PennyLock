workflows:
  # 第一步:只验证编译(已通过,保留备用)
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "PennyLock.xcodeproj" \
            -scheme "PennyLock" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

  # 第二步:签名构建 + 自动上传 App Store Connect
  ios-build:
    name: PennyLock iOS Build (signed)
    max_build_duration: 60
    integrations:
      app_store_connect: PennyLock
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.paulikschooner139.pennylock
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "PennyLock.xcodeproj" \
            --scheme "PennyLock"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # 第三步:模拟器截图(用于 App Store 提交)
  screenshots:
    name: Screenshots (simulator)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build for simulator
        script: |
          xcodebuild \
            -project "PennyLock.xcodeproj" \
            -scheme "PennyLock" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture screenshots
        script: |
          DEVICE="iPhone 15 Pro Max"
          BUNDLE="com.paulikschooner139.pennylock"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH="build/Build/Products/Debug-iphonesimulator/PennyLock.app"
          xcrun simctl install "$DEVICE" "$APP_PATH"

          SIMCTL_CHILD_UITEST_DEMO=1 SIMCTL_CHILD_UITEST_TAB=0 xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshot_01_overview.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE"

          SIMCTL_CHILD_UITEST_DEMO=1 SIMCTL_CHILD_UITEST_TAB=2 xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshot_02_analysis.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE"

          SIMCTL_CHILD_UITEST_DEMO=1 SIMCTL_CHILD_UITEST_TAB=3 xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshot_03_goal.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
    artifacts:
      - screenshot_*.png
