workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "PennyLock.xcodeproj" \
            -scheme "PennyLock" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
